[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrade"
version = "0.1.0"
description = "Modular Indian equity research and backtesting framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
market-data = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["analytics", "backtesting", "config", "core", "core.base", "core.market_data", "data", "data.providers", "reporting", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
