providers:
  synthetic_demo:
    type: synthetic

  yahoo_finance:
    type: yfinance

  zerodha_kite:
    type: kite_connect
    api_key_env: KITE_API_KEY
    access_token_env: KITE_ACCESS_TOKEN
    kite_interval: day
    instrument_cache_dir: data/cache/instruments

  groww_api:
    type: groww
    token_env: GROWW_ACCESS_TOKEN
    exchange: NSE
    segment: CASH
    candle_interval: 1day
    timeout_seconds: 30
    max_days_per_request: 175

  groww_fno:
    type: groww
    token_env: GROWW_ACCESS_TOKEN
    exchange: NSE
    segment: FNO
    candle_interval: 1day
    timeout_seconds: 30
    max_days_per_request: 175

  market_data_api_example:
    type: rest_json
    url: https://api.example.com/v1/ohlcv
    timeout_seconds: 30
    query_params:
      symbol: "{symbol}"
      start: "{start}"
      end: "{end}"
    auth:
      type: bearer
      token_env: MARKET_DATA_API_TOKEN
    response_path: data
    field_map:
      Date: timestamp
      Open: open
      High: high
      Low: low
      Close: close
      Volume: volume

  local_csv_example:
    type: csv
    path: data/raw/example.csv
