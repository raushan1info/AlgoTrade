datasets:
  reliance_demo:
    provider: synthetic_demo
    symbol: RELIANCE.NS
    interval: 1d
    data_kind: synthetic

  tcs_demo:
    provider: synthetic_demo
    symbol: TCS.NS
    interval: 1d
    data_kind: synthetic

  infy_demo:
    provider: synthetic_demo
    symbol: INFY.NS
    interval: 1d
    data_kind: synthetic

  # Real-data examples. Replace credentials in .env; providers are read-only.
  reliance_zerodha:
    provider: zerodha_kite
    symbol: NSE:RELIANCE
    interval: 1d
    data_kind: ohlcv

  reliance_groww:
    provider: groww_api
    symbol: NSE-RELIANCE
    interval: 1d
    data_kind: ohlcv

  # Example historical contract; replace with a contract available to your Groww account.
  nifty_option_example:
    provider: groww_fno
    symbol: NSE-NIFTY-04Jan24-19200-CE
    interval: 1d
    data_kind: option

  reliance_api_example:
    provider: market_data_api_example
    symbol: RELIANCE
    interval: 1d
    data_kind: ohlcv

  reliance_csv_example:
    provider: local_csv_example
    symbol: RELIANCE.NS
    interval: 1d
    data_kind: ohlcv
